<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PaperCheck – Create Test</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar no-print">
    <a class="brand" href="/">PaperCheck</a>
    <nav>
      <a href="/" class="active">Create Test</a>
      <a href="/evaluate.html">Evaluate Answer Sheets</a>
    </nav>
  </header>

  <main class="container">
    <div id="keyWarning" class="alert alert-warn hidden no-print"></div>

    <section class="card no-print">
      <h1>Create Test</h1>
      <p class="muted">Upload a textbook chapter PDF. PaperCheck will make a test only from that chapter.</p>

      <form id="createForm" novalidate>
        <label class="field">
          <span>Chapter PDF <small>(max 25 MB)</small></span>
          <input type="file" name="pdf" id="pdf" accept="application/pdf,.pdf" required>
        </label>

        <label class="field">
          <span>Test title</span>
          <input type="text" name="title" id="title" placeholder="Class 9 Physics – Chapter 1" required>
        </label>

        <div class="grid-4">
          <label class="field">
            <span>MCQs <small>(1 mark each)</small></span>
            <input type="number" name="mcqCount" value="5" min="0" max="50">
          </label>
          <label class="field">
            <span>Short questions <small>(2 marks each)</small></span>
            <input type="number" name="shortCount" value="5" min="0" max="30">
          </label>
          <label class="field">
            <span>Long questions <small>(6 marks each)</small></span>
            <input type="number" name="longCount" value="1" min="0" max="10">
          </label>
          <label class="field">
            <span>Time allowed <small>(minutes)</small></span>
            <input type="number" name="timeMinutes" value="45" min="5" max="300">
          </label>
        </div>

        <button type="submit" class="btn btn-primary" id="generateBtn">Generate Test</button>
      </form>

      <div id="status" class="status hidden" role="status" aria-live="polite"></div>
    </section>

    <section id="output" class="hidden"></section>

    <section class="card no-print">
      <h2>Saved tests</h2>
      <ul id="testList" class="test-list"><li class="muted">Loading…</li></ul>
    </section>
  </main>

  <!-- Filled just before printing (question paper or answer key). Hidden on screen. -->
  <div id="printArea" class="print-only"></div>

  <script src="/js/common.js"></script>
  <script src="/js/create.js"></script>
</body>
</html>
